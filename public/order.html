  <style>
    body.pfr-track {
      --pfr-purple: #3b0764;
      --pfr-purple-2: #5b21b6;
      --pfr-purple-soft: #f5f3ff;
      --pfr-amber: #fbbf24;
      --pfr-ink: #0f172a;
      --pfr-muted: #64748b;
      --pfr-line: #e8e5f0;
      --pfr-radius: 22px;
      --pfr-shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 8px 24px -14px rgba(59, 7, 100, .28);
      --trk-glow: transparent;
      --trk-glow-received: rgba(139, 92, 246, .42);
      --trk-glow-kitchen: rgba(245, 158, 11, .4);
      --trk-glow-ready: rgba(16, 185, 129, .4);
      --trk-glow-delivery: rgba(14, 165, 233, .38);
      --trk-glow-done: rgba(16, 185, 129, .28);
      --trk-glow-wait: rgba(100, 116, 139, .28);
      --trk-glow-bad: rgba(244, 63, 94, .32);
      --trk-glow-blur: 28px;
      background: #f8fafc;
      color: var(--pfr-ink);
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    body.pfr-track .glass {
      background: #fff;
      border: 1px solid var(--pfr-line);
      border-radius: var(--pfr-radius);
      box-shadow: var(--pfr-shadow);
      position: relative;
      z-index: 1;
    }
    body.pfr-track #orderRoot {
      position: relative;
      overflow: visible;
    }
    body.pfr-track #orderRoot::before {
      content: '';
      position: absolute;
      inset: -36px -16px -12px;
      z-index: -1;
      pointer-events: none;
      border-radius: 48px;
      background: radial-gradient(ellipse at 50% 18%, var(--trk-glow) 0%, transparent 68%);
      filter: blur(var(--trk-glow-blur));
      opacity: .5;
      transition: background .6s ease, opacity .6s ease;
      animation: trkAura 8s ease-in-out infinite;
    }
    body.pfr-track #orderRoot:has(.trk-stage[data-mood="received"]) { --trk-glow: var(--trk-glow-received); }
    body.pfr-track #orderRoot:has(.trk-stage[data-mood="kitchen"]) { --trk-glow: var(--trk-glow-kitchen); }
    body.pfr-track #orderRoot:has(.trk-stage[data-mood="ready"]) { --trk-glow: var(--trk-glow-ready); }
    body.pfr-track #orderRoot:has(.trk-stage[data-mood="delivery"]) { --trk-glow: var(--trk-glow-delivery); }
    body.pfr-track #orderRoot:has(.trk-stage[data-mood="done"]) { --trk-glow: var(--trk-glow-done); }
    body.pfr-track #orderRoot:has(.trk-stage[data-mood="wait"]) { --trk-glow: var(--trk-glow-wait); }
    body.pfr-track #orderRoot:not(:has(.trk-stage))::before { opacity: 0; animation: none; }
    @keyframes trkAura { 0%,100% { opacity: .42; } 50% { opacity: .62; } }
    #chatDrawer.hidden, #arrivedAlertBox.hidden, #alertBanner.hidden, #liveMapCard.hidden { display: none !important; }
    .live-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
    #liveMapCard.is-open .live-panel { grid-template-rows: 1fr; }
    .live-panel > div { overflow: hidden; min-height: 0; }
    .live-chev { transition: transform .3s ease; }
    #liveMapCard.is-open .live-chev { transform: rotate(180deg); }
    #liveMap { height: 240px; position: relative; z-index: 0; isolation: isolate; border-radius: 18px; }
    .live-pin { background: transparent; border: 0; }
    .live-badge { width: 34px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 17px; border: 3px solid #fff; box-shadow: 0 4px 12px rgba(15,23,42,.35); }
    .live-rider { position: relative; width: 44px; height: 44px; }
    .live-rider .live-badge { position: absolute; inset: 5px; width: 34px; height: 34px; background: #0284c7; }
    .live-rider::before { content: ''; position: absolute; inset: 0; border-radius: 999px; background: rgba(2,132,199,.25); animation: livePulse 1.8s ease-out infinite; }
    .live-rider-dir { position: absolute; inset: 0; transition: transform .4s ease; display: none; }
    .live-rider-dir::after { content: ''; position: absolute; left: 50%; top: -6px; transform: translateX(-50%); border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 11px solid #0284c7; }

      object-fit: cover; flex-shrink: 0; box-shadow: 0 4px 12px -4px rgba(251, 191, 36, .6);

    body.pfr-track .trk-header-title { font-size: 13px; font-weight: 800; letter-spacing: -.01em; line-height: 1.15; }

    /* Alerts */
    body.pfr-track .trk-arrived {

    body.pfr-track .trk-arrived-icon {

      display: flex; align-items: center; justify-content: center;

    /* Skeleton */
    body.pfr-track .trk-skel { display: flex; flex-direction: column; gap: 14px; padding: 4px 0 8px; }
    body.pfr-track .trk-skel-bar, body.pfr-track .trk-skel-hero, body.pfr-track .trk-skel-line {
      background: linear-gradient(90deg, #f1f5f9 0%, #e9e4f5 50%, #f1f5f9 100%);

    body.pfr-track .trk-skel-steps { display: flex; justify-content: space-between; padding: 6px 8px; }

    /* Top row */

    body.pfr-track .trk-kicker { font-size: 10px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: #6d28d9; }
    body.pfr-track .trk-pb { font-size: 28px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; color: var(--pfr-ink); }

    /* Hero */
    body.pfr-track .trk-stage { display: flex; flex-direction: column; gap: 12px; }
    body.pfr-track .trk-hero {

      background: radial-gradient(circle, rgba(255,255,255,.22) 0%, transparent 70%);
      animation: trkHeroDrift 12s ease-in-out infinite;
      pointer-events: none;
    }
    body.pfr-track .trk-hero::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;

    }
    body.pfr-track .trk-stage[data-mood="kitchen"] .trk-hero { box-shadow: 0 16px 32px -16px rgba(245, 158, 11, .55); border-color: rgba(253, 230, 138, .45); }
    body.pfr-track .trk-stage[data-mood="ready"] .trk-hero { box-shadow: 0 16px 32px -16px rgba(16, 185, 129, .5); border-color: rgba(167, 243, 208, .5); }
    body.pfr-track .trk-stage[data-mood="delivery"] .trk-hero { box-shadow: 0 16px 32px -16px rgba(14, 165, 233, .5); }
    body.pfr-track .trk-hero-emoji {
      position: relative; z-index: 1;
      width: 52px; height: 52px; border-radius: 16px;

    }
    body.pfr-track .trk-hero-title { position: relative; z-index: 1; font-size: 18px; font-weight: 800; letter-spacing: -.02em; margin-top: 10px; }
    body.pfr-track .trk-hero-body { position: relative; z-index: 1; font-size: 13px; font-weight: 600; color: rgba(255,255,255,.9); margin-top: 4px; line-height: 1.45; }
    @keyframes trkHeroDrift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-12px, 8px); } }

    /* Countdown */
    body.pfr-track .trk-eta {
      padding: 14px 16px 16px; border-radius: 20px; text-align: center;
      background: linear-gradient(180deg, #faf5ff 0%, #f5f3ff 100%);
      border: 1px solid #ede9fe;
    }
    body.pfr-track .trk-eta[data-state="ready"] { background: linear-gradient(180deg, #ecfdf5 0%, #d1fae5 100%); border-color: #a7f3d0; }
    body.pfr-track .trk-eta[data-state="waiting"] { background: #f8fafc; border-color: var(--pfr-line); }
    body.pfr-track .trk-eta-head { display: flex; align-items: center; justify-content: center; gap: 8px; }
    body.pfr-track .trk-eta-label { font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--pfr-muted); }
    body.pfr-track .trk-live {
      display: inline-flex; align-items: center; gap: 5px; height: 18px; padding: 0 8px;
      border-radius: 9999px; background: #fff; color: #e11d48; font-size: 9px; font-weight: 800; letter-spacing: .08em;
      border: 1px solid #fecdd3;
    }
    body.pfr-track .trk-live i {
      width: 6px; height: 6px; border-radius: 999px; background: #e11d48;
      animation: trkPulseDot 1.4s ease-in-out infinite;
      box-shadow: 0 0 0 0 rgba(225, 29, 72, .55);
    }
    body.pfr-track .trk-eta[data-state="live"] .trk-live {
      box-shadow: 0 0 12px rgba(225, 29, 72, .28);
    }
    body.pfr-track .trk-eta[data-state="live"] .trk-live i {
      animation: trkPulseDot 1.4s ease-in-out infinite, trkLiveGlow 1.6s ease-out infinite;
    }
    body.pfr-track .trk-eta[data-state="ready"] .trk-live { color: #047857; border-color: #a7f3d0; }
    body.pfr-track .trk-eta[data-state="ready"] .trk-live i { background: #10b981; animation: none; box-shadow: none; }
    body.pfr-track .trk-eta[data-state="waiting"] .trk-live { color: var(--pfr-muted); border-color: var(--pfr-line); }
    body.pfr-track .trk-eta[data-state="waiting"] .trk-live i { background: #94a3b8; animation: none; box-shadow: none; }
    body.pfr-track .trk-eta-clock {
      font-size: 40px; font-weight: 800; letter-spacing: -.04em; line-height: 1.15;

      text-shadow: 0 6px 18px rgba(59, 7, 100, .12);

    body.pfr-track .trk-eta[data-state="ready"] .trk-eta-clock { color: #047857; }

    body.pfr-track .trk-eta-bar {
      height: 6px; margin: 12px 8px 2px; border-radius: 99px; background: rgba(15, 23, 42, .08);

    }
    body.pfr-track .trk-eta-bar > i {

    body.pfr-track .trk-eta[data-state="waiting"] .trk-eta-bar { opacity: .4; }
    body.pfr-track .trk-eta[data-state="waiting"] .trk-eta-bar > i { box-shadow: none; background: #94a3b8; }

    body.pfr-track .trk-dot {

    body.pfr-track .trk-stage[data-mood="kitchen"] ~ .trk-steps .trk-step.is-current .trk-dot,

    body.pfr-track .trk-stage[data-mood="delivery"] ~ .trk-steps .trk-step.is-current .trk-dot,

    body.pfr-track .trk-step.is-current .trk-label { color: var(--pfr-purple); }

      background: #e2e8f0; position: relative; overflow: visible; align-self: flex-start;

<body class="pfr-track min-h-screen font-sans pb-16">
  <header class="trk-header">

  <div id="arrivedAlertBox" class="hidden max-w-md mx-auto mt-3 px-4">

      <div class="min-w-0 flex-1">
        <div class="font-black text-sm">Rider arrived</div>
        <p class="text-[11px] font-bold opacity-90">ගෙදර ළඟයි — doorstep එකට එන්න.</p>
      </div>

  <div id="alertBanner" class="hidden max-w-md mx-auto mt-3 px-4">

      <span class="trk-alert-bell" aria-hidden="true"><i class="fa-solid fa-bell"></i></span>
      <button type="button" onclick="enableAlerts()" class="flex-1 text-left font-black text-[11px] leading-snug">
        Alerts optional — kitchen / ready / delivery phone එකට එන්න ඕනේ නම් Allow කරන්න. නැත්නම් Skip.
      </button>
      <button type="button" onclick="skipAlerts()" class="trk-alert-skip">Skip</button>
    </div>

  <main class="trk-frame max-w-md mx-auto p-4 space-y-3">

        <span class="w-11 h-11 rounded-2xl bg-gradient-to-br from-sky-500 to-indigo-700 text-white text-xl flex items-center justify-center shrink-0 shadow-md">🛵</span>
        <span class="flex-1 min-w-0">
          <span class="block font-black text-sm text-slate-900">Track Rider · Rider බලන්න</span>

        </span>
        <svg class="live-chev w-5 h-5 text-slate-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>

  <div id="chatDrawer" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">

  <script>
    if (!firebase.apps.length) firebase.initializeApp(window.PEOPLES_FIREBASE_CONFIG);
    const db = firebase.database();
    let verifiedUser = null;
    try { verifiedUser = JSON.parse(localStorage.getItem('peoples_takeaway_user') || 'null'); } catch (e) { verifiedUser = null; }
    let orderKey = new URLSearchParams(location.search).get('id') || localStorage.getItem('peoples_last_order_key') || '';
    let orderCache = null;
    let prevStatus = '';
    let countdownTimer = null;
    let chatOn = false;
    let feedbackStars = 0;
    try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js'); } catch (e) {}

    function escapeHtml(v) {
      return String(v || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function digits(p) { return String(p || '').replace(/\D/g, ''); }
    function isMine(o) {
      if (!o || o.type !== 'Takeaway') return false;
      const uid = firebase.auth().currentUser && firebase.auth().currentUser.uid;
      if (uid && o.customerUid && o.customerUid === uid) return true;
      if (!verifiedUser) return true;
      const a = digits(verifiedUser.phone).slice(-9);
      const b = digits(o.customerPhone).slice(-9);
      return a.length >= 9 && a === b;
    }
    function isDone(order) {
      const flags = window.orderTrackerFlags(order) || {};
      return !!(flags.delivered || order.status === 'PickedUp' || order.status === 'Settled');
    }
    function trackUrl() { return '/order.html?id=' + encodeURIComponent(orderKey); }
    function showAlertBanner() {
      const el = document.getElementById('alertBanner');
      if (!el) return;
      let skipped = false;
      try { skipped = localStorage.getItem('peoples_skip_alerts') === '1'; } catch (e) {}
      const show = !skipped && ('Notification' in window) && Notification.permission === 'default';
      el.classList.toggle('hidden', !show);
    }
    function skipAlerts() {
      try { localStorage.setItem('peoples_skip_alerts', '1'); } catch (e) {}
      const el = document.getElementById('alertBanner');
      if (el) el.classList.add('hidden');
    }
    function enableAlerts() {
      window.peoplesAskNotify().then(function (p) {
        showAlertBanner();
        if (p === 'granted' && orderCache) {
          const c = window.peoplesNotifyCopy(orderCache, orderCache.status);
          window.peoplesNotifyOnce(orderKey, orderCache.status, c.title, c.body, trackUrl());
        }
      });
    }
    function notifyStatus(order, fromStatus) {
      const st = order.status;
      if (!st || st === fromStatus) return;
      const url = trackUrl();
      if (!fromStatus && (st === 'Received' || st === 'PendingPayment')) {
        const c = window.peoplesNotifyCopy(order, 'Received');
        window.peoplesNotifyOnce(orderKey, 'Received', c.title, c.body, url);
        return;
      }
      if (!fromStatus) return;
      const c = window.peoplesNotifyCopy(order, st);
      window.peoplesNotifyOnce(orderKey, st, c.title, c.body, url);
    }

    function hero(order) {
      const st = order.status;
      const flags = window.orderTrackerFlags(order) || {};
      if (st === 'Cancelled') return { emoji: '✕', title: 'Order cancelled', body: 'මේ ඇණවුම cancel වුණා.', tone: 'from-rose-600 to-rose-800' };
      if (st === 'Rejected') return { emoji: '!', title: 'Payment rejected', body: 'Slip / payment cashier reject කළා.', tone: 'from-rose-600 to-rose-800' };
      if (st === 'PendingPayment') return { emoji: '⏳', title: 'Waiting for payment', body: 'ගෙවීම confirm වෙනකම් kitchen start වෙන්නේ නෑ.', tone: 'from-amber-500 to-orange-600' };
      if (flags.delivered) return { emoji: '🎉', title: 'Delivered', body: 'Order එක ඔබට දුන්නා. Thank you!', tone: 'from-emerald-500 to-teal-700' };
      if (st === 'Arrived') return { emoji: '🛵', title: 'Rider is here', body: 'ගෙදර ළඟයි. Doorstep එකට එන්න.', tone: 'from-emerald-500 to-green-700' };
      if (flags.delivery) return { emoji: '🛵', title: 'On the way', body: 'Rider ඔබේ ගෙදරට යනවා.', tone: 'from-sky-500 to-indigo-700' };
      if (flags.ready) return { emoji: '✅', title: 'Ready', body: window.isDoorstepOrder(order) ? 'Packet ready. Rider බලාගන්න.' : ('Shop එකට ඇවිත් order number ' + escapeHtml(order.orderId || '') + ' කියන්න.'), tone: 'from-emerald-500 to-emerald-800' };
      if (flags.kitchen) return { emoji: '👨‍🍳', title: 'Kitchen', body: 'අපි දැන් හදනවා. ටිකක් ඉන්න.', tone: 'from-orange-500 to-amber-700' };
      return { emoji: '📝', title: 'Order received', body: window.isPickupOrder && window.isPickupOrder(order) ? ('Order number ' + escapeHtml(order.orderId || '') + ' · shop එකට ඇවිත් ගන්න.') : 'Shop එකට ඇණවුම ආවා. Confirm වෙනකම් ඉන්න.', tone: 'from-purple-700 to-violet-950' };
    }

    function trackMood(order) {
      const st = order.status;
      const flags = window.orderTrackerFlags(order) || {};
      if (st === 'Cancelled' || st === 'Rejected') return 'bad';
      if (st === 'PendingPayment') return 'wait';
      if (isDone(order)) return 'done';
      if (st === 'Ready') return 'ready';
      if (flags.delivery) return 'delivery';
      if (flags.kitchen && !flags.ready) return 'kitchen';
      return 'received';
    }

    function trackProgressPct(order) {
      const doorstep = window.isDoorstepOrder(order);
      const flags = window.orderTrackerFlags(order) || {};
      const ons = doorstep
        ? [flags.ordered, flags.kitchen, flags.ready, flags.delivery, flags.delivered]
        : [flags.ordered, flags.kitchen, flags.ready, flags.delivered || order.status === 'PickedUp'];
      let last = 0;
      ons.forEach(function (on, i) { if (on) last = i; });
      return ons.length > 1 ? Math.round((last / (ons.length - 1)) * 100) : 0;
    }

    function tracker(order, changed) {
      const doorstep = window.isDoorstepOrder(order);
      const flags = window.orderTrackerFlags(order) || {};
      const cancelled = order.status === 'Cancelled' || order.status === 'Rejected';
      const steps = doorstep
        ? [
            { on: flags.ordered, icon: '📝', label: 'Ordered', si: 'ඇණවුම' },
            { on: flags.kitchen, icon: '👨‍🍳', label: 'Kitchen', si: 'කුස්සිය' },
            { on: flags.ready, icon: '✅', label: 'Ready', si: 'සූදානම්' },
            { on: flags.delivery, icon: '🛵', label: 'Delivery', si: 'ගමන' },
            { on: flags.delivered, icon: '🏠', label: 'Done', si: 'භාරදුන්නා' }
          ]
        : [
            { on: flags.ordered, icon: '📝', label: 'Ordered', si: 'ඇණවුම' },
            { on: flags.kitchen, icon: '👨‍🍳', label: 'Kitchen', si: 'කුස්සිය' },
            { on: flags.ready, icon: '✅', label: 'Ready', si: 'සූදානම්' },
            { on: flags.delivered || order.status === 'PickedUp', icon: '🛍️', label: 'Picked up', si: 'අරගත්තා' }
          ];
      let last = 0;
      steps.forEach(function (s, i) { if (s.on) last = i; });
      const pct = trackProgressPct(order);
      const parts = [];
      steps.forEach(function (s, i) {
        if (i) {
          const linkDone = last >= i;
          const linkFresh = changed && last === i;
          parts.push('<span class="trk-link' + (linkDone ? ' is-done' : '') + (linkFresh ? ' is-fresh' : '') + '"></span>');
        }
        const current = s.on && i === last;
        const done = s.on && i < last;
        const cls = (current ? ' is-current' : '') + (done ? ' is-done' : '') + (current && changed ? ' is-fresh' : '');
        parts.push('<div class="trk-step' + cls + '">' +
          '<span class="trk-dot">' + s.icon + '</span>' +
          '<span class="trk-label">' + s.label + '</span>' +
          '<span class="trk-si">' + s.si + '</span>' +
        '</div>');
      });
      const currentLabel = steps[last] ? steps[last].label : '';
      const caption = cancelled ? 'Order closed' : ('Step ' + (last + 1) + ' of ' + steps.length + ' · ' + currentLabel);
      return '<div class="trk-steps" data-count="' + steps.length + '" data-cancelled="' + (cancelled ? '1' : '0') + '" style="--trk-p:' + pct + '%">' +
        parts.join('') + '</div><p class="trk-caption">' + caption + '</p>';
    }

    function canCancel(order) {
      return window.customerCanCancelOrder ? window.customerCanCancelOrder(order) : false;
    }

    function paymentHtml(order) {
      const pay = window.normalizePayment(order);
      const terminal = ['PickedUp','Settled','Cancelled','Rejected'].indexOf(order.status) >= 0;
      if (pay.method === 'payhere' && pay.status !== 'paid' && !terminal) {
        return '<div class="trk-pay is-sky space-y-2"><p class="text-[11px] font-black">PayHere — card / LankaQR එකෙන් ගෙවන්න. Paid උනාම kitchen start වෙනවා.</p><button type="button" onclick="payNowPayHere()" class="w-full bg-sky-700 text-white">Pay now — PayHere</button></div>';
      }
      if (pay.method === 'cash' && (order.status === 'Arrived' || order.status === 'Dispatched') && pay.status !== 'paid') {
        return '<div class="trk-pay is-amber text-[11px] font-black">Rider ට cash ගෙවන්න. Rs. ' + (order.total || 0).toLocaleString() + '</div>';
      }
      if (!(pay.method === 'bank' && pay.status !== 'paid' && !terminal)) return '';
      const hint = pay.status === 'pending_verify' ? 'Slip එක cashier බලනවා.' : (pay.status === 'rejected' ? 'Slip reject උනා. ආයෙන් upload කරන්න.' : 'Bank slip එක දාන්න.');
      const btn = pay.status === 'pending_verify' ? '' : '<input id="slipInput" type="file" accept="image/*" class="mt-2 block w-full text-[11px]"><button type="button" onclick="uploadSlip()" class="mt-2 w-full bg-purple-900 text-white">Upload bank slip</button>';
      return '<div class="trk-pay is-amber space-y-1"><p class="text-[11px] font-black">' + hint + '</p>' + btn + '</div>';
    }

    function feedbackHtml(order) {
      if (!isDone(order) || order.status === 'Cancelled' || order.status === 'Rejected') return '';
      if (order.feedback && order.feedback.stars) {
        return '<div class="trk-fb is-done"><div class="font-black text-emerald-900 text-sm">Thanks for the feedback</div><p class="text-[11px] font-bold text-emerald-800 mt-1">' + '★'.repeat(order.feedback.stars) + '☆'.repeat(5 - order.feedback.stars) + '</p></div>';
      }
      if (order.feedbackSkipped) return '';
      return '<div class="trk-fb space-y-2">' +
        '<div class="font-black text-sm text-slate-900">How was Peoples Family Restaurant?</div>' +
        '<p class="text-[11px] font-bold text-slate-600">Delivery උනාට පස්සේ feedback එකක් දෙන්න.</p>' +
        '<div id="starRow">' +
          [1,2,3,4,5].map(function (n) { return '<button type="button" onclick="setFeedbackStars(' + n + ')" class="fb-star text-2xl text-slate-300">☆</button>'; }).join('') +
        '</div>' +
        '<textarea id="feedbackComment" maxlength="200" placeholder="Comment (optional)" class="w-full border rounded-xl p-2 text-[11px] h-14 resize-none bg-slate-50"></textarea>' +
        '<div class="flex gap-2">' +
          '<button type="button" onclick="skipFeedback()" class="w-1/2 bg-slate-200 font-bold">Skip</button>' +
          '<button type="button" onclick="submitFeedback()" class="w-1/2 bg-emerald-600 text-white font-black">Send feedback</button>' +
        '</div></div>';
    }

    function render(order) {
      const root = document.getElementById('orderRoot');
      if (!order) {
        root.innerHTML = '<div class="trk-empty"><p>Order එක හොයාගන්න බැහැ. Menu එකට ආපහු යන්න.</p><a href="/" class="trk-cta is-purple"><i class="fa-solid fa-arrow-left"></i> Menu</a></div>';
        syncLiveTracking(null);
        return;
      }
      if (verifiedUser && !isMine(order)) {
        root.innerHTML = '<div class="trk-empty"><p class="is-bad">මේ order එක ඔබේ phone එකට නෙවෙයි.</p><a href="/" class="trk-cta is-purple"><i class="fa-solid fa-arrow-left"></i> Menu</a></div>';
        syncLiveTracking(null);
        return;
      }
      const h = hero(order);
      const items = window.orderItemRows(order).map(function (i) {
        return '<div class="trk-item"><div class="trk-item-left"><span class="trk-qty">' + escapeHtml(String(i.qty)) + 'x</span><span class="trk-item-name">' + escapeHtml(i.name) + '</span></div><span class="trk-item-price">Rs. ' + ((i.price * i.qty) || 0).toLocaleString() + '</span></div>' +
          (i.note ? '<div class="trk-item-note"><i class="fa-solid fa-note-sticky"></i> ' + escapeHtml(i.note) + '</div>' : '');
      }).join('');
      const addr = window.orderDeliveryAddress(order) || '';
      const km = window.orderDistanceLabel(order) || '';
      const ready = order.status === 'Ready';
      const st = order.status;
      const tone = ready ? 'ready' : ((st === 'Cancelled' || st === 'Rejected') ? 'bad' : (isDone(order) ? 'done' : 'wait'));
      const etaState = ready ? 'ready' : ((st === 'PendingPayment' || st === 'Cancelled' || st === 'Rejected') ? 'waiting' : 'live');
      const etaBadge = ready ? 'READY' : (etaState === 'waiting' ? 'WAIT' : 'LIVE');
      const readyBy = order.readyTimestamp
        ? '<div class="trk-eta-sub">Ready by ' + new Date(order.readyTimestamp).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + '</div>'
        : '';
      const changed = prevStatus && prevStatus !== order.status;
      const mood = trackMood(order);
      const pct = trackProgressPct(order);
      const veh = order.deliveryOption === 'Pick up by PickMe Driver'
        ? '<div class="trk-veh space-y-1"><label class="text-[10px] font-black text-purple-950">PickMe vehicle</label><div class="flex gap-1.5"><input id="vehNo" value="' + escapeHtml(order.vehicleNumber || '') + '" class="flex-grow border rounded-xl px-2 py-1 text-xs font-black uppercase"><button type="button" onclick="saveVeh()" class="bg-purple-900 text-white px-3 py-1 rounded-xl text-xs font-black">Save</button></div></div>'
        : '';
      const cancelBtn = canCancel(order)
        ? '<div class="trk-danger"><p class="trk-danger-hint"><i class="fa-solid fa-triangle-exclamation"></i> You can cancel only before the kitchen starts.</p><button type="button" onclick="cancelOrder()" class="trk-cancel">Cancel this order</button></div>'
        : (order.status !== 'Cancelled' && order.status !== 'Rejected' && !isDone(order)
          ? '<p class="trk-lock"><i class="fa-solid fa-lock"></i> Cashier / kitchen start කරලා. Cancel ඕනේ නම් shop එකට call කරන්න.</p>' : '');
      const doneBtns = (isDone(order) || order.status === 'Cancelled' || order.status === 'Rejected')
        ? '<a href="/" class="trk-cta">New order <i class="fa-solid fa-arrow-right"></i></a>' : '';
      const etaCard = isDone(order) ? '' :
        '<div class="trk-eta" data-state="' + etaState + '">' +
          '<div class="trk-eta-head"><span class="trk-eta-label">Estimated ready</span><span class="trk-live"><i></i>' + etaBadge + '</span></div>' +
          '<div id="readyClock" class="trk-eta-clock">—</div>' +
          '<div class="trk-eta-bar" aria-hidden="true"><i style="width:' + pct + '%"></i></div>' +
          readyBy +
        '</div>';

      root.innerHTML =
        '<div class="trk-top">' +
          '<div><div class="trk-kicker">Order number</div>' +
          '<div class="trk-pb">' + escapeHtml(order.orderId || '') + '</div></div>' +
          '<div class="trk-top-actions">' +
            '<span class="trk-status" data-tone="' + tone + '">' + escapeHtml(order.status) + '</span>' +
            '<button type="button" onclick="openChat()" class="trk-chat relative"><i class="fa-solid fa-comment-dots"></i> Chat' + window.chatBadgeHtml(orderKey, window.chatWatch(orderKey, order.chats, 'customer', chatDrawerOpen())) + '</button>' +
          '</div></div>' +
        '<div class="trk-stage" data-mood="' + mood + '">' +
        '<div class="trk-hero bg-gradient-to-br ' + h.tone + '">' +
          '<div class="trk-hero-emoji">' + h.emoji + '</div>' +
          '<div class="trk-hero-title">' + h.title + '</div>' +
          '<p class="trk-hero-body">' + h.body + '</p>' +
        '</div>' +
        etaCard +
        '</div>' +
        tracker(order, changed) +
        (addr ? '<div class="trk-addr"><i class="fa-solid fa-house"></i><div>' + escapeHtml(addr) + (km ? '<div class="trk-km">' + escapeHtml(km) + '</div>' : '') + '</div></div>' : '') +
        '<div class="trk-receipt"><div class="trk-receipt-head"><div><div class="trk-receipt-kicker">Receipt</div><div class="trk-receipt-id">' + escapeHtml(order.orderId || '') + '</div></div>' +
          (order.deliveryOption ? '<span class="trk-receipt-type">' + escapeHtml(order.deliveryOption) + '</span>' : '') +
        '</div><div class="trk-receipt-body">' + items + '</div>' +
        '<div class="trk-totals">' +
          '<div class="trk-tot"><span>Food</span><span>Rs. ' + (order.foodTotal || 0).toLocaleString() + '</span></div>' +
          '<div class="trk-tot"><span>Delivery</span><span>Rs. ' + (order.deliveryFee || 0).toLocaleString() + '</span></div>' +
          '<div class="trk-total-block"><span>Total</span><span>Rs. ' + (order.total || 0).toLocaleString() + '</span></div>' +
        '</div></div>' + veh +
        paymentHtml(order) + feedbackHtml(order) + cancelBtn + doneBtns;

      document.getElementById('arrivedAlertBox').classList.toggle('hidden', order.status !== 'Arrived');
      if (order.status === 'Arrived' && prevStatus && prevStatus !== 'Arrived') beep();
      if (order.status === 'Ready' && prevStatus && prevStatus !== 'Ready') beep();
      notifyStatus(order, prevStatus);
      prevStatus = order.status;
      startClock(order);
      showAlertBanner();
      syncLiveTracking(order);
    }

    const LEAFLET_CSS = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    const LEAFLET_JS = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    const LIVE_ETA_KMH = 25;
    const LIVE_STALE_MS = 90000;
    const LIVE_USER_PAN_HOLD_MS = 20000;
    let liveOpen = false;
    let liveCardOrder = null;
    let liveMap = null;
    let liveRiderMarker = null;
    let liveCustMarker = null;
    let liveLocRef = null;
    let liveLoc = null;
    let liveAnimFrame = 0;
    let liveInfoTimer = null;
    let liveFitted = false;
    let liveJumpNext = false;
    let liveProgrammatic = false;
    let liveUserMovedAt = 0;
    let leafletPromise = null;

    function trackOpenKey() { return 'pfr_track_open_' + orderKey; }

    function liveTrackEligible(order) {
      if (!order) return false;
      const flags = window.orderTrackerFlags(order) || {};
      return !!(flags.delivery && !flags.delivered) && window.isDoorstepOrder(order);
    }

    function syncLiveTracking(order) {
      const card = document.getElementById('liveMapCard');
      if (!card) return;
      if (!liveTrackEligible(order)) {
        teardownLiveTracking();
        card.classList.add('hidden');
        return;
      }
      liveCardOrder = order;
      card.classList.remove('hidden');
      const sub = document.getElementById('trackRiderSub');
      if (sub) {
        sub.textContent = order.status === 'Arrived'
          ? 'Rider arrived · ගෙදර ළඟයි'
          : (order.assignedRiderName ? order.assignedRiderName + ' · ' : '') + 'Rider on the way';
      }
      let wantOpen = false;
      try { wantOpen = sessionStorage.getItem(trackOpenKey()) === '1'; } catch (e) {}
      if (wantOpen && !liveOpen) setTrackOpen(true);
      else if (liveOpen && liveMap) {
        updateLiveCustomerMarker(order);
        refreshLiveInfo();
      }
    }

    function toggleTrackRider() { setTrackOpen(!liveOpen); }

    function setTrackOpen(open) {
      const card = document.getElementById('liveMapCard');
      const btn = document.getElementById('trackRiderBtn');
      liveOpen = !!open;
      card.classList.toggle('is-open', liveOpen);
      btn.setAttribute('aria-expanded', liveOpen ? 'true' : 'false');
      try { sessionStorage.setItem(trackOpenKey(), liveOpen ? '1' : '0'); } catch (e) {}
      if (liveOpen) openLiveMap();
      else pauseLiveTracking();
    }

    function loadLeaflet() {
      if (window.L) return Promise.resolve();
      if (leafletPromise) return leafletPromise;
      leafletPromise = new Promise(function (resolve, reject) {
        if (!document.querySelector('link[href="' + LEAFLET_CSS + '"]')) {
          const css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = LEAFLET_CSS;
          document.head.appendChild(css);
        }
        const s = document.createElement('script');
        s.src = LEAFLET_JS;
        s.onload = function () { resolve(); };
        s.onerror = function () {
          leafletPromise = null;
          s.remove();
          reject(new Error('Leaflet load failed'));
        };
        document.head.appendChild(s);
      });
      return leafletPromise;
    }

    function openLiveMap() {
      if (!liveMap) setLiveInfo('Loading map...');
      loadLeaflet().then(function () {
        if (!liveOpen || !liveCardOrder) return;
        if (!liveMap) createLiveMap();
        updateLiveCustomerMarker(liveCardOrder);
        liveMap.invalidateSize();
        attachLiveListener();
      }).catch(function () {
        setLiveInfo('Map load වුණේ නැහැ. Internet check කරලා ආයෙත් open කරන්න.', true);
      });
    }

    function liveBadgeIcon(emoji, bg) {
      return L.divIcon({
        className: 'live-pin',
        html: '<div class="live-badge" style="background:' + bg + '">' + emoji + '</div>',
        iconSize: [34, 34],
        iconAnchor: [17, 17]
      });
    }

    function createLiveMap() {
      const shop = window.PEOPLES_SHOP || { lat: 6.7190174, lng: 80.0682103 };
      liveMap = L.map('liveMap', { zoomControl: true }).setView([shop.lat, shop.lng], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(liveMap);
      L.marker([shop.lat, shop.lng], { icon: liveBadgeIcon('🏪', '#581c87'), title: 'Peoples Family Restaurant' }).addTo(liveMap);
      liveMap.on('movestart', function () {
        if (!liveProgrammatic) liveUserMovedAt = Date.now();
      });
      liveMap.on('moveend', function () { liveProgrammatic = false; });
    }

    function liveCustomerLatLng(order) {
      const c = order && order.deliveryMeta && order.deliveryMeta.coords;
      if (!c || !isFinite(Number(c.lat)) || !isFinite(Number(c.lng)) || !Number(c.lat)) return null;
      return L.latLng(Number(c.lat), Number(c.lng));
    }

    function updateLiveCustomerMarker(order) {
      if (!liveMap) return;
      const ll = liveCustomerLatLng(order);
      if (!ll) return;
      if (liveCustMarker) liveCustMarker.setLatLng(ll);
      else liveCustMarker = L.marker(ll, { icon: liveBadgeIcon('🏠', '#059669'), title: 'Your location' }).addTo(liveMap);
    }

    function attachLiveListener() {
      if (liveLocRef) return;
      liveJumpNext = true;
      liveLocRef = db.ref('rider_locations/' + orderKey);
      liveLocRef.on('value', onLiveLoc, function () {
        liveLocRef = null;
        setLiveInfo('Rider location load වුණේ නැහැ.', true);
      });
      clearInterval(liveInfoTimer);
      liveInfoTimer = setInterval(refreshLiveInfo, 5000);
      refreshLiveInfo();
    }

    function onLiveLoc(snap) {
      if (!liveMap) return;
      const v = snap.val();
      if (!v || !isFinite(Number(v.lat)) || !isFinite(Number(v.lng))) {
        liveLoc = null;
        cancelAnimationFrame(liveAnimFrame);
        if (liveRiderMarker) { liveRiderMarker.remove(); liveRiderMarker = null; }
        refreshLiveInfo();
        return;
      }
      const prev = liveLoc;
      liveLoc = v;
      const target = L.latLng(Number(v.lat), Number(v.lng));
      if (!liveRiderMarker) {
        liveRiderMarker = L.marker(target, {
          icon: L.divIcon({
            className: 'live-pin',
            html: '<div class="live-rider"><div class="live-rider-dir"></div><div class="live-badge">🛵</div></div>',
            iconSize: [44, 44],
            iconAnchor: [22, 22]
          }),
          zIndexOffset: 1000,
          title: 'Rider'
        }).addTo(liveMap);
      } else if (liveJumpNext || !prev || document.visibilityState !== 'visible') {
        cancelAnimationFrame(liveAnimFrame);
        liveRiderMarker.setLatLng(target);
      } else {
        const gap = (prev.at && v.at) ? (v.at - prev.at) : 1500;
        animateLiveRider(target, Math.max(300, Math.min(gap, 1500)));
      }
      liveJumpNext = false;
      setLiveRiderHeading(v.hdg);
      followLiveRider(target);
      refreshLiveInfo();
    }

    function animateLiveRider(target, duration) {
      cancelAnimationFrame(liveAnimFrame);
      const from = liveRiderMarker.getLatLng();
      const start = performance.now();
      function step(now) {
        if (!liveRiderMarker) return;
        const t = Math.min(1, (now - start) / duration);
        const e = 1 - Math.pow(1 - t, 3);
        liveRiderMarker.setLatLng([from.lat + (target.lat - from.lat) * e, from.lng + (target.lng - from.lng) * e]);
        if (t < 1) liveAnimFrame = requestAnimationFrame(step);
      }
      liveAnimFrame = requestAnimationFrame(step);
    }

    function setLiveRiderHeading(hdg) {
      const el = liveRiderMarker && liveRiderMarker.getElement();
      const dir = el && el.querySelector('.live-rider-dir');
      if (!dir) return;
      const deg = Number(hdg);
      if (hdg == null || !isFinite(deg)) {
        dir.style.display = 'none';
        return;
      }
      dir.style.display = 'block';
      dir.style.transform = 'rotate(' + deg + 'deg)';
    }

    function followLiveRider(target) {
      if (!liveFitted) {
        const cust = liveCustomerLatLng(liveCardOrder);
        liveProgrammatic = true;
        if (cust) liveMap.fitBounds(L.latLngBounds([target, cust]), { padding: [40, 40], maxZoom: 17 });
        else liveMap.setView(target, 16);
        liveFitted = true;
        return;
      }
      if (Date.now() - liveUserMovedAt < LIVE_USER_PAN_HOLD_MS) return;
      if (liveMap.getBounds().pad(-0.1).contains(target)) return;
      liveProgrammatic = true;
      liveMap.panTo(target, { animate: true });
    }

    function setLiveInfo(text, warn) {
      const el = document.getElementById('liveMapInfo');
      if (!el) return;
      el.textContent = text;
      el.classList.toggle('bg-amber-50', !!warn);
      el.classList.toggle('text-amber-900', !!warn);
      el.classList.toggle('bg-slate-50', !warn);
    }

    function refreshLiveInfo() {
      if (!liveOpen || !liveMap) return;
      if (!liveLoc) {
        setLiveInfo('Waiting for rider location... · Rider location එනකම් ඉන්න');
        return;
      }
      const parts = [];
      const cust = liveCustomerLatLng(liveCardOrder);
      if (liveCardOrder && liveCardOrder.status === 'Arrived') {
        parts.push('Rider arrived');
      } else if (cust) {
        const km = window.haversineKm(Number(liveLoc.lat), Number(liveLoc.lng), cust.lat, cust.lng);
        parts.push('Rider ' + (km < 1 ? Math.round(km * 1000) + ' m' : km.toFixed(1) + ' km') + ' away');
        parts.push('~' + Math.max(1, Math.round(km / LIVE_ETA_KMH * 60)) + ' min (approx.)');
      }
      parts.push('updated ' + window.formatAgo(liveLoc.at));
      const stale = Date.now() - Number(liveLoc.at || 0) > LIVE_STALE_MS;
      setLiveInfo((stale ? '⚠️ Rider signal weak · ' : '📍 ') + parts.join(' · '), stale);
    }

    function pauseLiveTracking() {
      if (liveLocRef) {
        liveLocRef.off('value', onLiveLoc);
        liveLocRef = null;
      }
      cancelAnimationFrame(liveAnimFrame);
      clearInterval(liveInfoTimer);
      liveInfoTimer = null;
    }

    function teardownLiveTracking() {
      pauseLiveTracking();
      liveOpen = false;
      liveCardOrder = null;
      const card = document.getElementById('liveMapCard');
      const btn = document.getElementById('trackRiderBtn');
      if (card) card.classList.remove('is-open');
      if (btn) btn.setAttribute('aria-expanded', 'false');
      if (liveMap) {
        liveMap.remove();
        liveMap = null;
      }
      liveRiderMarker = null;
      liveCustMarker = null;
      liveLoc = null;
      liveFitted = false;
    }

    document.getElementById('liveMapPanel').addEventListener('transitionend', function (e) {
      if (e.propertyName === 'grid-template-rows' && liveOpen && liveMap) liveMap.invalidateSize();
    });
    window.addEventListener('pagehide', pauseLiveTracking);
    window.addEventListener('pageshow', function (e) {
      if (e.persisted && liveOpen && liveMap) attachLiveListener();
    });

    function startClock(order) {
      clearInterval(countdownTimer);
      function tick() {
        const el = document.getElementById('readyClock');
        if (!el) return;
        if (order.status === 'Ready') { el.innerText = '🎉 READY'; return; }
        if (isDone(order)) { el.innerText = '✅ Done'; return; }
        const diff = Math.max(0, (order.readyTimestamp || 0) - Date.now());
        const m = Math.floor(diff / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        el.innerText = m + 'm ' + (s < 10 ? '0' : '') + s + 's';
      }
      tick();
      countdownTimer = setInterval(tick, 1000);
    }

    function beep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [523, 659, 784].forEach(function (f, i) {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.frequency.value = f;
          g.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.12);
          o.start(ctx.currentTime + i * 0.12);
          o.stop(ctx.currentTime + i * 0.12 + 0.2);
        });
      } catch (e) {}
    }

    function setFeedbackStars(n) {
      feedbackStars = n;
      document.querySelectorAll('.fb-star').forEach(function (el, i) {
        el.innerText = i < n ? '★' : '☆';
        el.className = 'fb-star text-2xl ' + (i < n ? 'text-amber-400' : 'text-slate-300');
      });
    }
    function submitFeedback() {
      if (!orderKey) return;
      if (!feedbackStars) return alert('Stars ටිකක් තෝරන්න.');
      const comment = ((document.getElementById('feedbackComment') || {}).value || '').trim().slice(0, 200);
      db.ref('orders/' + orderKey).update({
        feedback: {
          stars: feedbackStars,
          comment: comment,
          at: Date.now(),
          name: (verifiedUser && verifiedUser.name) || '',
          phone: (verifiedUser && verifiedUser.phone) || ''
        }
      }).then(function () { alert('Thanks for the feedback!'); }).catch(window.alertDbError);
    }
    function skipFeedback() {
      if (!orderKey) return;
      db.ref('orders/' + orderKey).update({ feedbackSkipped: true }).catch(window.alertDbError);
    }

    function cancelOrder() {
      if (!orderKey || !orderCache || !canCancel(orderCache)) return alert('Cashier / kitchen start කරලා. Cancel ඕනේ නම් shop එකට call කරන්න.');
      if (!confirm('මේ order එක cancel කරන්නද?')) return;
      window.applyOrderFields(db, orderKey, { status: 'Cancelled', cancelledAt: Date.now(), cancelledBy: 'customer' }, orderCache).catch(window.alertDbError);
    }
    function saveVeh() {
      const v = (document.getElementById('vehNo') || {}).value;
      if (!v || !orderKey) return alert('වාහන අංකය දාන්න.');
      db.ref('orders/' + orderKey).update({ vehicleNumber: v.trim() }).catch(window.alertDbError);
    }
    function payNowPayHere() {
      if (!orderKey) return;
      window.startPayHereCheckout(orderKey).catch(function (err) {
        alert((err && err.message) || 'PayHere open වුණේ නැහැ.');
      });
    }
    function uploadSlip() {
      const input = document.getElementById('slipInput');
      if (!input || !input.files || !input.files[0]) return alert('Slip එකක් තෝරන්න.');
      const reader = new FileReader();
      reader.onload = function (e) {
        const pay = window.normalizePayment(orderCache || {});
        db.ref('orders/' + orderKey).update({
          paymentSlip: e.target.result,
          payment: { method: 'bank', timing: pay.timing || 'before', status: 'pending_verify', slip: e.target.result, uploadedAt: Date.now() }
        }).then(function () { alert('Slip එක යැව්වා. Cashier බලනවා.'); }).catch(window.alertDbError);
      };
      reader.readAsDataURL(input.files[0]);
    }
    function chatDrawerOpen() {
      const drawer = document.getElementById('chatDrawer');
      return !!drawer && !drawer.classList.contains('hidden');
    }
    function openChat() {
      document.getElementById('chatDrawer').classList.remove('hidden');
      document.getElementById('chatTitle').innerText = '💬 Order chat · Cashier & Rider';
      if (!orderKey) return;
      const cachedChats = (orderCache && orderCache.chats) || {};
      window.renderChatThread(document.getElementById('chatBox'), cachedChats, 'customer');
      window.chatMarkSeen(orderKey, cachedChats, 'customer');
      if (chatOn) return;
      chatOn = true;
      db.ref('orders/' + orderKey + '/chats').on('value', function (snap) {
        const chats = snap.val() || {};
        window.renderChatThread(document.getElementById('chatBox'), chats, 'customer');
        if (chatDrawerOpen()) window.chatMarkSeen(orderKey, chats, 'customer');
      }, window.onDbListenError);
    }
    function toggleChat() { document.getElementById('chatDrawer').classList.add('hidden'); }
    function sendChat() {
      const input = document.getElementById('chatInput');
      const text = (input.value || '').trim();
      if (!text || !orderKey) return;
      db.ref('orders/' + orderKey + '/chats').push(window.chatPush('customer', (verifiedUser && verifiedUser.name) || 'Customer', text)).then(function () { input.value = ''; }).catch(window.alertDbError);
    }

    window.ensureCustomerAuth().then(function () {
      if (orderKey) window.rememberOrderKey(orderKey);
      if (!orderKey) {
        render(null);
      } else {
        db.ref('orders/' + orderKey).on('value', function (snap) {
          orderCache = snap.val();
          render(orderCache);
        }, function () {
          render(null);
        });
      }
    }).catch(function () {
      render(null);
    });
  </script>
</body>
</html>
